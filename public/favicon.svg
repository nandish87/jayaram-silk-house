<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E761E" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#4A0E17" stroke="url(#goldFav)" stroke-width="4" />
  <!-- Auspicious Ganesha / Weaving Shuttle Silhouette -->
  <!-- Crown / Mukut -->
  <polygon points="60,18 53,28 67,28" fill="url(#goldFav)" />
  <circle cx="60" cy="18" r="3" fill="#FFF3B0" />
  <!-- Head & Ears -->
  <path d="M 42,34 Q 30,38 34,48 Q 38,56 46,52" fill="none" stroke="url(#goldFav)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 78,34 Q 90,38 86,48 Q 82,56 74,52" fill="none" stroke="url(#goldFav)" stroke-width="3" stroke-linecap="round"/>
  <!-- Forehead & Tilak -->
  <line x1="56" y1="34" x2="64" y2="34" stroke="url(#goldFav)" stroke-width="2.5" />
  <circle cx="60" cy="39" r="2.5" fill="#FFE885" />
  <!-- Trunk Curve (Left curve traditionally auspicious) -->
  <path d="M 60,34 Q 57,48 57,60 Q 57,75 70,75 Q 78,75 76,68 Q 74,63 68,66" fill="none" stroke="url(#goldFav)" stroke-width="4" stroke-linecap="round"/>
  <!-- Modak / Lotus base -->
  <ellipse cx="60" cy="94" rx="28" ry="8" fill="none" stroke="url(#goldFav)" stroke-width="2.5"/>
  <text x="60" y="108" text-anchor="middle" fill="#FFF3B0" font-size="8" font-family="serif" letter-spacing="1">Y. JAYARAM</text>
</svg>

